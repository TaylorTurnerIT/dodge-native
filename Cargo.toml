[workspace]
resolver = "2"
members = [
    "crates/dodge-core",
    "crates/dodge-rl-env",
    "crates/dodge-native-runner",
    "crates/dodge-viewer",
]
exclude = ["learning/native"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
