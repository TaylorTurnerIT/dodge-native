[package]
name = "dodge-rl-env"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dodge_rl_env"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
dodge-core = { path = "../dodge-core" }
rayon = "1.11"
pyo3 = { version = "0.27", optional = true }
numpy = { version = "0.27", optional = true }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
