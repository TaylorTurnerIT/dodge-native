@media(max-width:480px){#dodge-replay canvas{width:100%}}

    const reader=new Blob([packed]).stream().pipeThrough(new DecompressionStream('deflate')).getReader();
    const parts=[];let length=0;
    while(true){const chunk=await reader.read();if(chunk.done)break;parts.push(chunk.value);length+=chunk.value.length;}
    data=new Uint8Array(length);let pos=0;for(const part of parts){data.set(part,pos);pos+=part.length;}
    if(data.length!==frameCount*16384)throw new Error('Frame length mismatch');
    slider.max=last;draw(0);
    const first=pixels.data.slice();draw(Math.floor(last/2));
    console.assert(pixels.data.some((value,i)=>value!==first[i]),'Midpoint must differ from initial image');
    draw(0);toggle.disabled=false;toggle.textContent='Play';
    console.log(JSON.stringify({playback_ready:true,frame_count:frameCount,compressed_bytes:packed.length,decoded_bytes:data.length,overflow:document.documentElement.scrollWidth>innerWidth}));
    window.dodgePlayback={seek(frame){pause();draw(frame);return index;},state(){return {index,playing,score:scores[index]};}};
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)play();
    requestAnimationFrame(tick);
  })().catch(error=>{detail.textContent='Playback error: '+error.message;detail.setAttribute('role','alert');console.error(error);});
})();
